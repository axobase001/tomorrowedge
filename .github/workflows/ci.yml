name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.19.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run web:build
      - if: matrix.node-version == '20.19.x'
        run: npx playwright install --with-deps chromium
      - if: matrix.node-version == '20.19.x'
        run: npm run e2e:cockpit
      - if: failure() && matrix.node-version == '20.19.x'
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-e2e-artifacts
          path: .tomorrowedge/e2e-artifacts/cockpit
          if-no-files-found: ignore
      - run: npm run secrets:scan
      - run: npm run smoke:cli
      - run: npm audit --audit-level=high
      - run: npm run pack:dry

goal:
  id: mock_artifact
  title: "Create mock artifact"
  description: "Use the mock AgentBridge to create a deterministic result artifact."
  mode: coding
  desired_state:
    summary: "The requested artifact exists and the hard verification gate passes."
    success_conditions:
      - id: result_exists
        description: "The mock AgentBridge must create the result artifact."
        type: file_exists
        required: true
        path: result.md
  constraints:
    allowed_paths: ["."]
    denied_paths: [".git", ".runs"]
    max_files_changed: 5
    max_iterations: 3
    require_human_review: false
  artifacts:
    required:
      - path: result.md
        description: "Minimal result artifact created by the AgentBridge."

evaluation:
  hard_gates:
    - id: result_exists
      type: file_exists
      path: result.md
      timeout_sec: 10
      required: true
  soft_gates:
    - id: checker_review
      type: checker_agent
      required: false
      threshold: 0.75
      timeout_sec: 10
  judge:
    mode: hard_plus_checker
    checker_role: "reviewer"
    min_confidence: 0.75
  evidence_required: true

loop:
  max_iterations: 3
  strategy: reconcile
  one_item_per_loop: true
  fresh_context_each_iteration: true
  retry_policy:
    type: none
    base_delay_sec: 0
    max_delay_sec: 0
  stop_when:
    all_hard_gates_pass: true
    all_required_conditions_met: true
    checker_confidence_above: 0.75
    no_unresolved_blockers: true
  abort_when:
    max_iterations_reached: true
    no_progress_rounds: 2
    repeated_failure_rounds: 3
    budget_exhausted: true

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="TomorrowEdge TUI cockpit mockup">
  <rect width="1440" height="900" fill="#0d1117"/>
  <text x="36" y="48" fill="#d1d5db" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700">TomorrowEdge / tedge</text>
  <text x="36" y="78" fill="#8b949e" font-family="Consolas, Menlo, monospace" font-size="15">TUI cockpit for multi-model coding agents. Visible state, explicit approval, reversible actions.</text>
  <rect x="36" y="104" width="1368" height="38" fill="#161b22" stroke="#d29922"/>
  <text x="54" y="129" fill="#d29922" font-family="Consolas, Menlo, monospace" font-size="15">Safe mode: approval required for patch apply and shell commands.</text>

  <g font-family="Consolas, Menlo, monospace">
    <rect x="36" y="166" width="436" height="364" fill="#111827" stroke="#30363d"/>
    <text x="56" y="196" fill="#d1d5db" font-size="18" font-weight="700">Agents</text>
    <text x="56" y="232" fill="#58a6ff" font-size="14">planner</text>
    <text x="160" y="232" fill="#3fb950" font-size="14">success</text>
    <text x="255" y="232" fill="#8b949e" font-size="14">mock/mock-balanced</text>
    <text x="56" y="266" fill="#58a6ff" font-size="14">explorer</text>
    <text x="160" y="266" fill="#3fb950" font-size="14">success</text>
    <text x="255" y="266" fill="#8b949e" font-size="14">mock/mock-balanced</text>
    <text x="56" y="300" fill="#58a6ff" font-size="14">coder_a</text>
    <text x="160" y="300" fill="#3fb950" font-size="14">success</text>
    <text x="255" y="300" fill="#8b949e" font-size="14">fixture-scripted</text>
    <text x="56" y="334" fill="#58a6ff" font-size="14">reviewer</text>
    <text x="160" y="334" fill="#3fb950" font-size="14">success</text>
    <text x="255" y="334" fill="#8b949e" font-size="14">mock/mock-balanced</text>
    <text x="56" y="368" fill="#58a6ff" font-size="14">judge</text>
    <text x="160" y="368" fill="#3fb950" font-size="14">select</text>
    <text x="255" y="368" fill="#8b949e" font-size="14">fixture_candidate_a</text>
    <text x="56" y="402" fill="#58a6ff" font-size="14">runner</text>
    <text x="160" y="402" fill="#d29922" font-size="14">waiting_for_user</text>
    <text x="56" y="452" fill="#8b949e" font-size="13">a approve patch  ·  t run tests  ·  q quit</text>

    <rect x="496" y="166" width="404" height="166" fill="#111827" stroke="#30363d"/>
    <text x="516" y="196" fill="#d1d5db" font-size="18" font-weight="700">Goal</text>
    <text x="516" y="230" fill="#d1d5db" font-size="14">fix failing test without changing schema</text>
    <text x="516" y="264" fill="#8b949e" font-size="14">type=test  risk=medium</text>
    <text x="516" y="298" fill="#d29922" font-size="14">constraint: Without changing schema</text>

    <rect x="924" y="166" width="480" height="166" fill="#111827" stroke="#30363d"/>
    <text x="944" y="196" fill="#d1d5db" font-size="18" font-weight="700">Router</text>
    <text x="944" y="230" fill="#8b949e" font-size="14">mode=balanced  privacyLocked=false</text>
    <text x="944" y="264" fill="#58a6ff" font-size="14">Planner/Judge</text>
    <text x="1108" y="264" fill="#d1d5db" font-size="14">strong reasoning route</text>
    <text x="944" y="298" fill="#58a6ff" font-size="14">Explorer/Coder</text>
    <text x="1108" y="298" fill="#d1d5db" font-size="14">efficient implementation route</text>

    <rect x="496" y="356" width="404" height="214" fill="#111827" stroke="#30363d"/>
    <text x="516" y="386" fill="#d1d5db" font-size="18" font-weight="700">Debate</text>
    <text x="516" y="420" fill="#3fb950" font-size="14">fixture_candidate_a: minimal patch</text>
    <text x="516" y="454" fill="#8b949e" font-size="14">fixture_candidate_b: no concrete fix</text>
    <text x="516" y="500" fill="#58a6ff" font-size="14">Judge: select fixture_candidate_a</text>
    <text x="516" y="532" fill="#8b949e" font-size="14">Reason: highest scoring acceptable candidate</text>

    <rect x="924" y="356" width="480" height="304" fill="#111827" stroke="#30363d"/>
    <text x="944" y="386" fill="#d1d5db" font-size="18" font-weight="700">Diff</text>
    <text x="944" y="420" fill="#8b949e" font-size="14">Diff preview: +1 / -1</text>
    <text x="944" y="454" fill="#8b949e" font-size="14">export function add(a, b) {</text>
    <text x="944" y="488" fill="#f85149" font-size="14">-  return a - b;</text>
    <text x="944" y="522" fill="#3fb950" font-size="14">+  return a + b;</text>
    <text x="944" y="556" fill="#8b949e" font-size="14">}</text>
    <rect x="944" y="592" width="198" height="32" fill="#161b22" stroke="#d29922"/>
    <text x="962" y="614" fill="#d29922" font-size="14">Awaiting approval</text>

    <rect x="36" y="554" width="436" height="172" fill="#111827" stroke="#30363d"/>
    <text x="56" y="584" fill="#d1d5db" font-size="18" font-weight="700">Evidence</text>
    <text x="56" y="620" fill="#8b949e" font-size="14">result=partially_completed</text>
    <text x="56" y="654" fill="#3fb950" font-size="14">offline graph completed</text>
    <text x="56" y="688" fill="#d29922" font-size="14">risk: Patch awaits user authorization</text>

    <rect x="496" y="594" width="404" height="132" fill="#111827" stroke="#30363d"/>
    <text x="516" y="624" fill="#d1d5db" font-size="18" font-weight="700">Shell</text>
    <text x="516" y="660" fill="#8b949e" font-size="14">proposed: npm test</text>
    <text x="516" y="694" fill="#d29922" font-size="14">waiting for t approval</text>

    <rect x="36" y="750" width="1368" height="86" fill="#111827" stroke="#30363d"/>
    <text x="56" y="784" fill="#d1d5db" font-size="18" font-weight="700">Memory</text>
    <text x="56" y="816" fill="#8b949e" font-size="14">session: plan, context, candidate diff, review, judge decision, approvals, run results, final summary</text>
  </g>
</svg>
